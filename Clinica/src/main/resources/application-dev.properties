spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/hospital_dev}
spring.datasource.username=${DB_USER:dev}
spring.datasource.password=${DB_PASS:dev}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.data.mongodb.uri=${MONGO_URI:mongodb://dev:dev@localhost:27017/devdb?authSource=admin}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

spring.flyway.enabled=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer


spring.kafka.consumer.group-id=hospital-group

spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=br.com.monolithlabs.clinica.*