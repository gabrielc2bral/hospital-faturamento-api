<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Consultas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <style>
        :root {
            --ink: #3a3a4a;
            --primary: #8b9aad;
            --primary-light: #9db3c5;
            --accent-mint: #7ecac0;
            --mist: #f0f2f5;
            --paper: #fafbfc;
            --line: #d5dce5;
        }

        body {
            background-color: var(--paper);
            color: var(--ink);
            font-family: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
            min-height: 100vh;
        }

        .navbar {
            background-color: white !important;
            border-bottom: 1px solid var(--line);
            box-shadow: 0 1px 3px rgba(58, 58, 74, 0.04);
        }

        .navbar-brand {
            font-family: "Georgia", serif;
            font-weight: 700;
            color: var(--primary) !important;
        }

        .conteudo {
            max-width: 800px;
            margin: 0 auto;
            padding: 3rem 1rem;
        }

        .page-header h1 {
            font-family: "Georgia", serif;
            color: var(--primary);
        }

        .card-custom {
            background: white;
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 1px 6px rgba(139, 154, 173, 0.08);
        }

        .btn-primary-custom {
            background-color: var(--primary);
            border-color: var(--primary);
            border-radius: 8px;
            color: white;
        }

        .status-agendada {
            color: #2f8a5c;
            font-weight: 600;
        }

        .status-cancelada {
            color: #8b3030;
            font-weight: 600;
        }

        .alert-success {
            background-color: #eef8f0;
            border-color: #cfe8d6;
            color: #2f8a5c;
            border-radius: 8px;
        }

        .alert-danger {
            background-color: #fdf0f0;
            border-color: #f0cece;
            color: #8b3030;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Hospital</a>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="btn btn-outline-secondary">Sair</button>
        </form>
    </div>
</nav>

<div class="conteudo">

    <div class="page-header mb-4 d-flex justify-content-between align-items-center">
        <div>
            <h1>Minhas Consultas</h1>
            <p class="text-muted mb-0">Acompanhe seus agendamentos.</p>
        </div>
        <a th:href="@{/paciente/consultas/nova}" class="btn btn-primary btn-primary-custom">Agendar consulta</a>
    </div>

    <div class="alert alert-success" th:if="${sucesso}" th:text="${sucesso}"></div>
    <div class="alert alert-danger" th:if="${erroGeral}" th:text="${erroGeral}"></div>

    <div class="card-custom">

        <div class="text-muted" th:if="${#lists.isEmpty(consultas)}">
            Você ainda não tem consultas agendadas.
        </div>

        <table class="table" th:unless="${#lists.isEmpty(consultas)}">
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Horário</th>
                    <th>Médico</th>
                    <th>Especialidade</th>
                    <th>Status</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="c : ${consultas}">
                    <td th:text="${#temporals.format(c.data, 'dd/MM/yyyy')}">01/01/2026</td>
                    <td th:text="${#temporals.format(c.horario, 'HH:mm')}">08:00</td>
                    <td th:text="${c.medico.nome}">Dr. Fulano</td>
                    <td th:text="${c.medico.especialidade.nome}">Cardiologia</td>
                    <td>
                        <span th:if="${c.status.name() == 'AGENDADA'}" class="status-agendada">Agendada</span>
                        <span th:if="${c.status.name() == 'CANCELADA'}" class="status-cancelada">Cancelada</span>
                    </td>
                    <td>
                        <form th:if="${c.status.name() == 'AGENDADA'}"
                              th:action="@{/paciente/consultas/{id}/cancelar(id=${c.id})}"
                              method="post">
                            <button type="submit" class="btn btn-sm btn-outline-secondary">Cancelar</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>

    </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
