<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concluir cadastro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <style>
        :root {
            --ink: #1f2a24;
            --sage: #3f6652;
            --sage-dark: #2d4a3b;
            --mist: #eef2ee;
            --paper: #fbfaf7;
            --line: #d8e0d9;
            --error: #a8413a;
        }

        body {
            background-color: var(--mist);
            color: var(--ink);
            font-family: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
            min-height: 100vh;
        }

        .step-rail {
            font-size: 0.8rem;
            letter-spacing: 0.04em;
            color: #6b7a70;
            text-transform: uppercase;
        }

        .step-rail .step-current {
            color: var(--sage-dark);
            font-weight: 600;
        }

        .card-form {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 6px;
            box-shadow: 0 1px 3px rgba(31, 42, 36, 0.06);
        }

        .card-form .card-header {
            background: var(--sage-dark);
            color: var(--paper);
            border-radius: 6px 6px 0 0;
            padding: 1.5rem 2rem 1.25rem;
        }

        .card-form .card-body {
            padding: 2rem;
        }

        h1.form-title {
            font-family: "Georgia", "Source Serif 4", serif;
            font-size: 1.5rem;
            margin-bottom: 0.25rem;
        }

        .form-subtitle {
            font-size: 0.9rem;
            opacity: 0.85;
        }

        label.form-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--sage-dark);
        }

        .form-control {
            border-color: var(--line);
            padding: 0.6rem 0.75rem;
        }

        .form-control:focus {
            border-color: var(--sage);
            box-shadow: 0 0 0 3px rgba(63, 102, 82, 0.15);
        }

        .btn-concluir {
            background-color: var(--sage-dark);
            border-color: var(--sage-dark);
            padding: 0.65rem 1.5rem;
            font-weight: 600;
        }

        .btn-concluir:hover {
            background-color: var(--sage);
            border-color: var(--sage);
        }

        .invalid-feedback {
            font-size: 0.8rem;
        }

        .field-hint {
            font-size: 0.78rem;
            color: #6b7a70;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">

            <div class="step-rail mb-3 text-center">
                Cadastro &nbsp;&rsaquo;&nbsp; Validação &nbsp;&rsaquo;&nbsp;
                <span class="step-current">Dados pessoais</span>
            </div>

            <div th:if="${mensagemErro}" class="alert alert-danger" role="alert">
                <span th:text="${mensagemErro}"></span>
            </div>

            <div class="card-form">
                <div class="card-header">
                    <h1 class="form-title">Quase lá</h1>
                    <p class="form-subtitle mb-0">Confirme seus dados pessoais para concluir o cadastro.</p>
                </div>

                <div class="card-body">
                    <form th:action="@{/auth/cadastro/concluir}"
                          th:object="${paciente}"
                          method="post"
                          novalidate>

                        <div class="mb-3">
                            <label for="nomeCompleto" class="form-label">Nome completo</label>
                            <input type="text"
                                   class="form-control"
                                   id="nomeCompleto"
                                   th:field="*{nomeCompleto}"
                                   th:classappend="${#fields.hasErrors('nomeCompleto')} ? 'is-invalid'"
                                   placeholder="Como está no seu documento"
                                   autocomplete="name"
                                   required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('nomeCompleto')}"
                                 th:errors="*{nomeCompleto}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="cpf" class="form-label">CPF</label>
                            <input type="text"
                                   class="form-control"
                                   id="cpf"
                                   th:field="*{cpf}"
                                   th:classappend="${#fields.hasErrors('cpf')} ? 'is-invalid'"
                                   placeholder="000.000.000-00"
                                   inputmode="numeric"
                                   maxlength="14"
                                   autocomplete="off"
                                   required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('cpf')}"
                                 th:errors="*{cpf}"></div>
                            <div class="field-hint" id="cpf-hint">Somente números, a formatação é automática.</div>
                        </div>

                        <div class="mb-4">
                            <label for="dataNascimento" class="form-label">Data de nascimento</label>
                            <input type="date"
                                   class="form-control"
                                   id="dataNascimento"
                                   th:field="*{dataNascimento}"
                                   th:classappend="${#fields.hasErrors('dataNascimento')} ? 'is-invalid'"
                                   th:max="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}"
                                   required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('dataNascimento')}"
                                 th:errors="*{dataNascimento}"></div>
                        </div>

                        <button type="submit" class="btn btn-concluir w-100">
                            Concluir cadastro
                        </button>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    (function () {
        const cpfInput = document.getElementById('cpf');

        cpfInput.addEventListener('input', function (e) {
            let digits = e.target.value.replace(/\D/g, '').slice(0, 11);

            let formatted = digits;
            if (digits.length > 9) {
                formatted = digits.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, '$1.$2.$3-$4');
            } else if (digits.length > 6) {
                formatted = digits.replace(/(\d{3})(\d{3})(\d{1,3})/, '$1.$2.$3');
            } else if (digits.length > 3) {
                formatted = digits.replace(/(\d{3})(\d{1,3})/, '$1.$2');
            }

            e.target.value = formatted;
        });

        function validarCPF(cpf) {
            cpf = cpf.replace(/\D/g, '');
            if (cpf.length !== 11 || /^(\d)\1{10}$/.test(cpf)) return false;

            let soma = 0, resto;
            for (let i = 1; i <= 9; i++) soma += parseInt(cpf.substring(i - 1, i)) * (11 - i);
            resto = (soma * 10) % 11;
            if (resto === 10 || resto === 11) resto = 0;
            if (resto !== parseInt(cpf.substring(9, 10))) return false;

            soma = 0;
            for (let i = 1; i <= 10; i++) soma += parseInt(cpf.substring(i - 1, i)) * (12 - i);
            resto = (soma * 10) % 11;
            if (resto === 10 || resto === 11) resto = 0;
            return resto === parseInt(cpf.substring(10, 11));
        }

        const form = cpfInput.closest('form');
        const hint = document.getElementById('cpf-hint');

        form.addEventListener('submit', function (e) {
            if (!validarCPF(cpfInput.value)) {
                e.preventDefault();
                cpfInput.classList.add('is-invalid');
                hint.textContent = 'CPF inválido. Verifique os números digitados.';
                hint.classList.add('text-danger');
                cpfInput.focus();
            }
        });

        cpfInput.addEventListener('input', function () {
            cpfInput.classList.remove('is-invalid');
            hint.textContent = 'Somente números, a formatação é automática.';
            hint.classList.remove('text-danger');
        });
    })();
</script>

</body>
</html>
