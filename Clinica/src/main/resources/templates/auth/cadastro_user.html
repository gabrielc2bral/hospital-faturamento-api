<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <style>
        :root {
            --ink: #1f2a24;
            --sage: #3f6652;
            --sage-dark: #2d4a3b;
            --mist: #eef2ee;
            --paper: #fbfaf7;
            --line: #d8e0d9;
            --error: #a8413a;
        }

        body {
            background-color: var(--mist);
            color: var(--ink);
            font-family: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
            min-height: 100vh;
        }

        .step-rail {
            font-size: 0.8rem;
            letter-spacing: 0.04em;
            color: #6b7a70;
            text-transform: uppercase;
        }

        .step-rail .step-current {
            color: var(--sage-dark);
            font-weight: 600;
        }

        .card-form {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 6px;
            box-shadow: 0 1px 3px rgba(31, 42, 36, 0.06);
        }

        .card-form .card-header {
            background: var(--sage-dark);
            color: var(--paper);
            border-radius: 6px 6px 0 0;
            padding: 1.5rem 2rem 1.25rem;
        }

        .card-form .card-body {
            padding: 2rem;
        }

        h1.form-title {
            font-family: "Georgia", "Source Serif 4", serif;
            font-size: 1.5rem;
            margin-bottom: 0.25rem;
        }

        .form-subtitle {
            font-size: 0.9rem;
            opacity: 0.85;
        }

        label.form-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--sage-dark);
        }

        .form-control {
            border-color: var(--line);
            padding: 0.6rem 0.75rem;
        }

        .form-control:focus {
            border-color: var(--sage);
            box-shadow: 0 0 0 3px rgba(63, 102, 82, 0.15);
        }

        .form-text {
            font-size: 0.78rem;
            color: #6b7a70;
        }

        .btn-cadastrar {
            background-color: var(--sage-dark);
            border-color: var(--sage-dark);
            padding: 0.65rem 1.5rem;
            font-weight: 600;
        }

        .btn-cadastrar:hover {
            background-color: var(--sage);
            border-color: var(--sage);
        }

        .login-link {
            font-size: 0.9rem;
            color: #6b7a70;
        }

        .login-link a {
            color: var(--sage-dark);
            font-weight: 600;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* Modal no mesmo tom da página */
        .modal-content {
            border: none;
            border-radius: 6px;
        }

        .modal-header {
            border-bottom: 1px solid var(--line);
        }

        .modal-header.is-success {
            background-color: #f0f5f1;
        }

        .modal-header.is-error {
            background-color: #f7eceb;
        }

        .modal-title {
            font-weight: 600;
            font-size: 1.05rem;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">

            <div class="step-rail mb-3 text-center">
                <span class="step-current">Cadastro</span> &nbsp;&rsaquo;&nbsp;
                Validação &nbsp;&rsaquo;&nbsp;
                Dados pessoais
            </div>

            <div class="card-form">
                <div class="card-header">
                    <h1 class="form-title">Criar sua conta</h1>
                    <p class="form-subtitle mb-0">Informe seu email e crie uma senha para começar.</p>
                </div>

                <div class="card-body">
                    <form th:action="@{/auth/cadastro}" th:object="${usuario}" method="post" novalidate>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email"
                                   class="form-control"
                                   id="email"
                                   th:field="*{email}"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                                   aria-describedby="emailHelp"
                                   autocomplete="email"
                                   placeholder="seuemail@exemplo.com"
                                   required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}"
                                 th:errors="*{email}"></div>
                            <div id="emailHelp" class="form-text">Vamos enviar um código de confirmação para este
                                endereço.
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="senha" class="form-label">Senha</label>
                            <div class="input-group">
                                <input type="password"
                                       class="form-control"
                                       id="senha"
                                       th:field="*{senha}"
                                       th:classappend="${#fields.hasErrors('senha')} ? 'is-invalid'"
                                       autocomplete="new-password"
                                       minlength="8"
                                       required>
                                <button type="button" class="btn btn-outline-secondary" id="toggleSenha"
                                        aria-label="Mostrar senha">
                                    <i class="bi" id="toggleSenhaIcon">👁</i>
                                </button>
                            </div>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('senha')}"
                                 th:errors="*{senha}"></div>
                            <div class="form-text">Mínimo de 8 caracteres.</div>
                        </div>

                        <button type="submit" class="btn btn-cadastrar w-100">
                            Cadastrar
                        </button>

                        <p class="login-link text-center mt-3 mb-0">
                            Já tem uma conta? <a th:href="@{/login}">Entrar</a>
                        </p>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- Modal de mensagem -->
<div class="modal fade" id="mensagemModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header" th:classappend="${mensagemSucesso} ? 'is-success' : 'is-error'">
                <h5 class="modal-title">
                    <span th:if="${mensagemSucesso}">Cadastro recebido</span>
                    <span th:if="${mensagemErro}">Algo deu errado</span>
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>

            <div class="modal-body">
                <p class="mb-0" th:if="${mensagemSucesso}" th:text="${mensagemSucesso}"></p>
                <p class="mb-0" th:if="${mensagemErro}" th:text="${mensagemErro}"></p>
            </div>

        </div>
    </div>
</div>

<script th:if="${mensagemSucesso != null or mensagemErro != null}">
    document.addEventListener('DOMContentLoaded', function () {
        const modal = new bootstrap.Modal(document.getElementById('mensagemModal'));
        modal.show();
    });
</script>

<script>
    document.getElementById('toggleSenha').addEventListener('click', function () {
        const senhaInput = document.getElementById('senha');
        const isPassword = senhaInput.type === 'password';
        senhaInput.type = isPassword ? 'text' : 'password';
        document.getElementById('toggleSenhaIcon').textContent = isPassword ? '🙈' : '👁';
    });
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
