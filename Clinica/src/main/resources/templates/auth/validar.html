<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validar email</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <style>
        :root {
            --ink: #3a3a4a;
            --primary: #8b9aad;
            --primary-light: #9db3c5;
            --accent-mint: #7ecac0;
            --mist: #f0f2f5;
            --paper: #fafbfc;
            --line: #d5dce5;
            --error: #b55a5a;
        }

        body {
            background-color: var(--mist);
            color: var(--ink);
            font-family: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
            min-height: 100vh;
        }

        .step-rail {
            font-size: 0.8rem;
            letter-spacing: 0.04em;
            color: #7a8a9a;
            text-transform: uppercase;
        }

        .step-rail .step-current {
            color: var(--primary);
            font-weight: 600;
        }

        .card-form {
            background: white;
            border: 1px solid var(--line);
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(139, 154, 173, 0.1);
        }

        .card-form .card-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            border-radius: 12px 12px 0 0;
            padding: 1.5rem 2rem 1.25rem;
        }

        .card-form .card-body {
            padding: 2rem;
        }

        h1.form-title {
            font-family: "Georgia", "Source Serif 4", serif;
            font-size: 1.5rem;
            margin-bottom: 0.25rem;
        }

        .form-subtitle {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        label.form-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--primary);
        }

        .form-control {
            border-color: var(--line);
            border-radius: 8px;
            padding: 0.6rem 0.75rem;
        }

        .form-control:focus {
            border-color: var(--accent-mint);
            box-shadow: 0 0 0 3px rgba(126, 202, 192, 0.15);
        }

        .form-control:disabled {
            background-color: var(--mist);
            color: #7a6b8a;
        }

        .form-text {
            font-size: 0.78rem;
            color: #7a6b8a;
        }

        .btn-validar {
            background-color: var(--primary);
            border-color: var(--primary);
            padding: 0.65rem 1.5rem;
            font-weight: 600;
            border-radius: 8px;
            color: white;
        }

        .btn-validar:hover {
            background-color: var(--primary-light);
            border-color: var(--primary-light);
            color: white;
        }

        /* Campo de código */
        .codigo-input {
            font-size: 1.6rem;
            letter-spacing: 0.5rem;
            text-align: center;
            font-family: "Courier New", monospace;
            font-weight: 600;
            border-radius: 8px;
        }

        .reenviar-link {
            font-size: 0.85rem;
        }

        .reenviar-link button {
            background: none;
            border: none;
            color: var(--primary);
            font-weight: 600;
            padding: 0;
            cursor: pointer;
        }

        .reenviar-link button:hover {
            text-decoration: underline;
        }

        .reenviar-link button:disabled {
            color: #b8a5c8;
            cursor: not-allowed;
            text-decoration: none;
        }

        /* Modal */
        .modal-content {
            border: none;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(139, 154, 173, 0.12);
        }

        .modal-header {
            border-bottom: 1px solid var(--line);
        }

        .modal-header.is-success {
            background-color: #f5f0f8;
        }

        .modal-header.is-error {
            background-color: #fdf0f0;
        }

        .modal-title {
            font-weight: 600;
            font-size: 1.05rem;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">

            <div class="step-rail mb-3 text-center">
                Cadastro &nbsp;&rsaquo;&nbsp;
                <span class="step-current">Validação</span> &nbsp;&rsaquo;&nbsp;
                Dados pessoais
            </div>

            <div class="card-form">
                <div class="card-header">
                    <h1 class="form-title">Confirme seu email</h1>
                    <p class="form-subtitle mb-0">Enviamos um código de 6 dígitos para o endereço informado.</p>
                </div>

                <div class="card-body">
                    <form th:action="@{/auth/cadastro/validar}" th:object="${usuario}" method="post" novalidate>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email"
                                   class="form-control"
                                   id="email"
                                   th:field="*{email}"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                                   autocomplete="email"
                                   required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}"
                                 th:errors="*{email}"></div>
                        </div>

                        <div class="mb-2">
                            <label for="code" class="form-label">Código de confirmação</label>
                            <input type="text"
                                   class="form-control codigo-input"
                                   id="code"
                                   th:field="*{code}"
                                   th:classappend="${#fields.hasErrors('code')} ? 'is-invalid'"
                                   inputmode="numeric"
                                   pattern="[0-9]*"
                                   maxlength="6"
                                   autocomplete="one-time-code"
                                   placeholder="000000"
                                   required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('code')}"
                                 th:errors="*{code}"></div>
                        </div>

                        <p class="reenviar-link mb-4">
                            Não recebeu? <button type="button" id="btnReenviar">Reenviar código</button>
                            <span id="reenviarTimer" class="text-muted d-none"></span>
                        </p>

                        <button type="submit" class="btn btn-validar w-100">
                            Confirmar
                        </button>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- Modal de mensagem -->
<div class="modal fade" id="mensagemModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header" th:classappend="${mensagemSucesso} ? 'is-success' : 'is-error'">
                <h5 class="modal-title">
                    <span th:if="${mensagemSucesso}">Confirmado</span>
                    <span th:if="${mensagemErro}">Não foi possível confirmar</span>
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>

            <div class="modal-body">
                <p class="mb-0" th:if="${mensagemSucesso}" th:text="${mensagemSucesso}"></p>
                <p class="mb-0" th:if="${mensagemErro}" th:text="${mensagemErro}"></p>
            </div>

        </div>
    </div>
</div>

<script th:if="${mensagemSucesso != null or mensagemErro != null}">
    document.addEventListener('DOMContentLoaded', function () {
        const modal = new bootstrap.Modal(document.getElementById('mensagemModal'));
        modal.show();
    });
</script>

<script>
    // Só aceita números no campo de código
    document.getElementById('code').addEventListener('input', function (e) {
        e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
    });

    // Cooldown simples no "reenviar código" (apenas UX local;
    // o controle real de limite deve ficar no backend)
    // Ainda sem a função no back para enviar o código novamente
    (function () {
        const btn = document.getElementById('btnReenviar');
        const timerLabel = document.getElementById('reenviarTimer');
        let segundosRestantes = 0;
        let intervalId = null;

        btn.addEventListener('click', function () {
            // TODO: disparar requisição para reenviar o código
            // ex: fetch('/auth/cadastro/reenviar-codigo', { method: 'POST', ... })

            segundosRestantes = 30;
            btn.disabled = true;
            timerLabel.classList.remove('d-none');

            intervalId = setInterval(function () {
                segundosRestantes--;
                timerLabel.textContent = 'Aguarde ' + segundosRestantes + 's';

                if (segundosRestantes <= 0) {
                    clearInterval(intervalId);
                    btn.disabled = false;
                    timerLabel.classList.add('d-none');
                }
            }, 1000);
        });
    })();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
