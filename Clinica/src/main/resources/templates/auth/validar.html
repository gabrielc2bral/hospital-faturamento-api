<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Cadastro de paciente!</title>
</head>
<body>

<div class="container vh-100 d-flex justify-content-center align-items-center">
    <div class="row w-100">
        <div class="col-md-6 mx-auto">
            <form action="/cadastro/validar" th:object="${usuario}" method="post">
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" aria-describedby="emailHelp" th:field="*{email}" required>
                    <div id="emailHelp" class="form-text">Nunca compartilharemos seu e-mail com ninguém.</div>
                </div>
                <div class="mb-3">
                    <label for="code" class="form-label">code</label>
                    <input type="text" class="form-control" id="code" th:field="*{code}" required>
                </div>

                <button type="submit" class="btn btn-primary">Cadastrar</button>
            </form>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="mensagemModal" tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">Mensagem</h5>

                <button type="button" class="btn-close" data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <p th:if="${mensagemSucesso}" th:text="${mensagemSucesso}"></p>

                <p th:if="${mensagemErro}" th:text="${mensagemErro}"></p>

            </div>

        </div>

    </div>

</div>


<script th:if="${mensagemSucesso != null or mensagemErro != null}">

    document.addEventListener('DOMContentLoaded', function () {

        const modal = new bootstrap.Modal(
                document.getElementById('mensagemModal')
        );

        modal.show();
    });

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
