<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <style>
        :root {
            --ink: #3a3a4a;
            --primary: #8b9aad;
            --primary-light: #9db3c5;
            --accent-mint: #7ecac0;
            --mist: #f0f2f5;
            --paper: #fafbfc;
            --line: #d5dce5;
            --error: #b55a5a;
            --error-bg: #fdf0f0;
            --success-bg: #eef6f2;
        }

        body {
            background-color: var(--mist);
            color: var(--ink);
            font-family: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
            min-height: 100vh;
        }

        .card-form {
            background: white;
            border: 1px solid var(--line);
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(139, 154, 173, 0.1);
        }

        .card-form .card-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            border-radius: 12px 12px 0 0;
            padding: 1.5rem 2rem 1.25rem;
        }

        .card-form .card-body {
            padding: 2rem;
        }

        h1.form-title {
            font-family: "Georgia", "Source Serif 4", serif;
            font-size: 1.5rem;
            margin-bottom: 0.25rem;
        }

        .form-subtitle {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        label.form-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--primary);
        }

        .form-control {
            border-color: var(--line);
            border-radius: 8px;
            padding: 0.6rem 0.75rem;
        }

        .form-control:focus {
            border-color: var(--accent-mint);
            box-shadow: 0 0 0 3px rgba(126, 202, 192, 0.15);
        }

        .form-text {
            font-size: 0.78rem;
            color: #7a6b8a;
        }

        .btn-entrar {
            background-color: var(--primary);
            border-color: var(--primary);
            padding: 0.65rem 1.5rem;
            font-weight: 600;
            border-radius: 8px;
            color: white;
        }

        .btn-entrar:hover {
            background-color: var(--primary-light);
            border-color: var(--primary-light);
            color: white;
        }

        .cadastro-link {
            font-size: 0.9rem;
            color: #6b85a0;
        }

        .cadastro-link a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
        }

        .cadastro-link a:hover {
            text-decoration: underline;
        }

        .alert-login-error {
            background-color: var(--error-bg);
            border: 1px solid #f0cece;
            color: var(--error);
            font-size: 0.9rem;
            border-radius: 8px;
        }

        .alert-login-success {
            background-color: var(--success-bg);
            border: 1px solid #b8d5e8;
            color: var(--sage-dark);
            font-size: 0.9rem;
            border-radius: 8px;
        }

        .btn-outline-secondary {
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">

            <!-- Spring Security manda erro via ?error na URL -->
            <div class="alert alert-login-error" th:if="${param.error}" role="alert">
                Email ou senha incorretos. Tente novamente.
            </div>

            <!-- Spring Security manda confirmação de logout via ?logout na URL -->
            <div class="alert alert-login-success" th:if="${param.logout}" role="alert">
                Você saiu da sua conta com sucesso.
            </div>

            <!-- Logout forçado após concluir o cadastro -->
            <div class="alert alert-login-success" th:if="${param.cadastroConcluido}" role="alert">
                Cadastro concluído com sucesso! Faça login novamente para acessar sua conta.
            </div>

            <div class="card-form">
                <div class="card-header">
                    <h1 class="form-title">Entrar</h1>
                    <p class="form-subtitle mb-0">Acesse sua conta para continuar.</p>
                </div>

                <div class="card-body">
                    <form th:action="@{/login}" method="post" novalidate>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email"
                                   class="form-control"
                                   id="email"
                                   name="username"
                                   autocomplete="email"
                                   autofocus
                                   required>
                        </div>

                        <div class="mb-4">
                            <label for="senha" class="form-label">Senha</label>
                            <div class="input-group">
                                <input type="password"
                                       class="form-control"
                                       id="senha"
                                       name="password"
                                       autocomplete="current-password"
                                       required>
                                <button type="button" class="btn btn-outline-secondary" id="toggleSenha"
                                        aria-label="Mostrar senha">
                                    <span id="toggleSenhaIcon">👁</span>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-entrar w-100">
                            Entrar
                        </button>

                        <p class="cadastro-link text-center mt-3 mb-0">
                            Ainda não tem conta? <a th:href="@{/auth/cadastro}">Cadastre-se</a>
                        </p>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    document.getElementById('toggleSenha').addEventListener('click', function () {
        const senhaInput = document.getElementById('senha');
        const isPassword = senhaInput.type === 'password';
        senhaInput.type = isPassword ? 'text' : 'password';
        document.getElementById('toggleSenhaIcon').textContent = isPassword ? '🙈' : '👁';
    });
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
