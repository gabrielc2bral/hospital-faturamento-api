<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <style>
        :root {
            --ink: #1f2a24;
            --sage: #3f6652;
            --sage-dark: #2d4a3b;
            --mist: #eef2ee;
            --paper: #fbfaf7;
            --line: #d8e0d9;
            --error: #a8413a;
            --error-bg: #f7eceb;
            --success-bg: #f0f5f1;
        }

        body {
            background-color: var(--mist);
            color: var(--ink);
            font-family: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
            min-height: 100vh;
        }

        .card-form {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 6px;
            box-shadow: 0 1px 3px rgba(31, 42, 36, 0.06);
        }

        .card-form .card-header {
            background: var(--sage-dark);
            color: var(--paper);
            border-radius: 6px 6px 0 0;
            padding: 1.5rem 2rem 1.25rem;
        }

        .card-form .card-body {
            padding: 2rem;
        }

        h1.form-title {
            font-family: "Georgia", "Source Serif 4", serif;
            font-size: 1.5rem;
            margin-bottom: 0.25rem;
        }

        .form-subtitle {
            font-size: 0.9rem;
            opacity: 0.85;
        }

        label.form-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--sage-dark);
        }

        .form-control {
            border-color: var(--line);
            padding: 0.6rem 0.75rem;
        }

        .form-control:focus {
            border-color: var(--sage);
            box-shadow: 0 0 0 3px rgba(63, 102, 82, 0.15);
        }

        .form-text {
            font-size: 0.78rem;
            color: #6b7a70;
        }

        .btn-entrar {
            background-color: var(--sage-dark);
            border-color: var(--sage-dark);
            padding: 0.65rem 1.5rem;
            font-weight: 600;
        }

        .btn-entrar:hover {
            background-color: var(--sage);
            border-color: var(--sage);
        }

        .cadastro-link {
            font-size: 0.9rem;
            color: #6b7a70;
        }

        .cadastro-link a {
            color: var(--sage-dark);
            font-weight: 600;
            text-decoration: none;
        }

        .cadastro-link a:hover {
            text-decoration: underline;
        }

        .alert-login-error {
            background-color: var(--error-bg);
            border: 1px solid #e2c2bf;
            color: var(--error);
            font-size: 0.9rem;
        }

        .alert-login-success {
            background-color: var(--success-bg);
            border: 1px solid #c7dccd;
            color: var(--sage-dark);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">

            <!-- Spring Security manda erro via ?error na URL -->
            <div class="alert alert-login-error" th:if="${param.error}" role="alert">
                Email ou senha incorretos. Tente novamente.
            </div>

            <!-- Spring Security manda confirmação de logout via ?logout na URL -->
            <div class="alert alert-login-success" th:if="${param.logout}" role="alert">
                Você saiu da sua conta com sucesso.
            </div>

            <!-- Logout forçado após concluir o cadastro -->
            <div class="alert alert-login-success" th:if="${param.cadastroConcluido}" role="alert">
                Cadastro concluído com sucesso! Faça login novamente para acessar sua conta.
            </div>

            <div class="card-form">
                <div class="card-header">
                    <h1 class="form-title">Entrar</h1>
                    <p class="form-subtitle mb-0">Acesse sua conta para continuar.</p>
                </div>

                <div class="card-body">
                    <form th:action="@{/login}" method="post" novalidate>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email"
                                   class="form-control"
                                   id="email"
                                   name="username"
                                   autocomplete="email"
                                   autofocus
                                   required>
                        </div>

                        <div class="mb-4">
                            <label for="senha" class="form-label">Senha</label>
                            <div class="input-group">
                                <input type="password"
                                       class="form-control"
                                       id="senha"
                                       name="password"
                                       autocomplete="current-password"
                                       required>
                                <button type="button" class="btn btn-outline-secondary" id="toggleSenha"
                                        aria-label="Mostrar senha">
                                    <span id="toggleSenhaIcon">👁</span>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-entrar w-100">
                            Entrar
                        </button>

                        <p class="cadastro-link text-center mt-3 mb-0">
                            Ainda não tem conta? <a th:href="@{/auth/cadastro}">Cadastre-se</a>
                        </p>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    document.getElementById('toggleSenha').addEventListener('click', function () {
        const senhaInput = document.getElementById('senha');
        const isPassword = senhaInput.type === 'password';
        senhaInput.type = isPassword ? 'text' : 'password';
        document.getElementById('toggleSenhaIcon').textContent = isPassword ? '🙈' : '👁';
    });
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
