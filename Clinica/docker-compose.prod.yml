version: '3.8'

services:

  postgres:
    image: postgres:17.7
    container_name: postgres_hospital_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data_hospital_prod:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  mongo:
    image: mongo:7
    container_name: mongo_hospital_prod
    restart: always
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - mongo_data_hospital_prod:/data/db

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_gui_hospital_prod
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    depends_on:
      - postgres
    ports:
      - "5051:80"
  redis:
    image: redis:8
    restart: always
    volumes:
      - redis_data_prod_hospital:/data

  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka_prod_hospital
    restart: always

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

    volumes:
      - kafka_data_prod_hospital:/tmp/kraft-combined-logs
  api:
    build: .
    container_name: hospital_prod
    restart: always
    depends_on:
      - postgres
      - mongo
      - redis
      - kafka
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      JWT_SECRET: ${JWT_SECRET}
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      MONGO_URI: ${MONGO_URI}

volumes:
  postgres_data_prod_hospital:
  mongo_data_prod_hospital:
  redis_data_prod_hospital:
  kafka_data_prod_hospital:
